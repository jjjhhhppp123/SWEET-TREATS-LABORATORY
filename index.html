<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWEET TREATS LABORATORY | 桌布分享平台</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Zen Maru Gothic"', 'sans-serif'],
                        mono: ['"Nunito"', 'sans-serif'],
                    },
                    colors: {
                        sweetBg: '#fff5f7',
                        cardBg: '#ffffff',
                        sweetAccent: '#ffb3c6',
                        sweetText: '#5c4d53',
                        sweetBorder: '#ffd1dc'
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #fff5f7;
            color: #5c4d53;
            font-family: 'Zen Maru Gothic', sans-serif;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 179, 198, 0.15) 0%, transparent 70%),
                url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0L60 30L30 60L0 30Z' fill='%23ffe4e8' opacity='0.5'/%3E%3Cpath d='M30 0L60 30L30 60L0 30Z' stroke='%23ffb3c6' stroke-width='1' stroke-dasharray='4 2' fill='none'/%3E%3Cpath d='M0 0L60 60M60 0L0 60' stroke='%23ffb3c6' stroke-width='1' stroke-dasharray='4 2' opacity='0.3'/%3E%3C/svg%3E");
            background-attachment: fixed;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .font-round {
            font-weight: 900;
            letter-spacing: 0.02em;
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 2px dashed #ffd1dc;
        }

        .sweet-card {
            background-color: #ffffff;
            border-radius: 24px;
            overflow: hidden;
            border: 2px solid #ffd1dc;
            box-shadow: 0 10px 20px -5px rgba(255, 179, 198, 0.3);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .sweet-card:hover {
            transform: translateY(-8px) rotate(-1deg);
            box-shadow: 0 15px 30px -5px rgba(255, 179, 198, 0.5);
            border-color: #ffb3c6;
        }

        .lang-btn {
            border-radius: 9999px;
            transition: all 0.2s;
            color: #ff8fab;
            font-weight: 700;
        }
        .lang-btn.active {
            background-color: #ffb3c6;
            color: #ffffff;
            font-weight: 900;
        }

        .filter-btn {
            padding: 8px 20px;
            border-radius: 9999px;
            font-size: 0.9rem;
            border: 2px dashed #ffd1dc;
            background-color: #ffffff;
            color: #ff8fab;
            transition: all 0.2s;
            font-weight: 700;
            height: 40px;
            display: flex;
            align-items: center;
        }
        .filter-btn.active, .filter-btn:hover {
            background-color: #ffb3c6;
            color: #ffffff;
            border: 2px solid #ffb3c6;
            font-weight: 900;
            box-shadow: 0 5px 15px rgba(255, 179, 198, 0.4);
        }

        .cute-clock {
            color: #ffb3c6;
            text-shadow: 
                -2px -2px 0 #fff,
                 2px -2px 0 #fff,
                -2px  2px 0 #fff,
                 2px  2px 0 #fff,
                 0px  4px 0px rgba(255, 179, 198, 1);
        }

        body.modal-open { overflow: hidden; }
        
        /* 換裝動畫專用 */
        .outfit-transition {
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
    </style>
    
    <script src="wallpapers.js"></script>
</head>
<body class="min-h-screen flex flex-col selection:bg-[#ffb3c6] selection:text-white">

    <nav class="glass-nav fixed top-0 left-0 w-full z-50 px-4 md:px-12 py-3 flex justify-between items-center gap-2">
        <a href="#" class="font-round text-sm md:text-xl text-[#5c4d53] flex items-center gap-2 shrink-0">
            <span>🎀</span>
            <span class="hidden min-[400px]:inline">SWEET TREATS LABORATORY</span>

        <div class="flex items-center gap-2 md:gap-4 shrink-0">
            <div class="bg-white p-1 rounded-full flex gap-1 border-2 border-[#ffd1dc] shadow-sm">
                <button onclick="setLanguage('zh')" id="btn-zh" class="lang-btn text-[10px] md:text-xs px-3 py-1">中文</button>
                <button onclick="setLanguage('ja')" id="btn-ja" class="lang-btn text-[10px] md:text-xs px-3 py-1">日本語</button>

    </nav>

    <section class="relative w-full min-h-[40vh] flex flex-col justify-center pt-28 pb-16 mb-8 border-b-4 border-[#ffd1dc]/50 shadow-sm">
        <div class="absolute inset-0 z-0 overflow-hidden">
            <div class="absolute inset-0 bg-cover bg-center bg-no-repeat opacity-95" style="background-image: url('https://drive.google.com/thumbnail?id=1FBCo4K8lPXGpDIWTBMs1Wfz3CpKC74Yx&sz=w1920');"></div>
            <div class="absolute inset-0 bg-gradient-to-t from-[#fff5f7] via-[#fff5f7]/30 to-transparent"></div>
            <div class="absolute inset-0 bg-gradient-to-b from-white/40 to-transparent h-32"></div>
        </div>
        <header class="relative z-10 px-6 text-center max-w-4xl mx-auto w-full">
            <h1 class="font-round text-4xl md:text-5xl lg:text-6xl text-[#5c4d53] leading-tight drop-shadow-md bg-white/70 inline-block px-8 py-3 rounded-[32px] backdrop-blur-sm border-2 border-white/60 shadow-sm">
                SWEET TREATS LABORATORY

    <section class="px-6 max-w-3xl mx-auto w-full mb-8 relative z-10 -mt-16">
        <div class="bg-white/95 backdrop-blur-sm border-2 border-[#ffd1dc] p-8 md:p-10 rounded-[32px] shadow-sm flex flex-col justify-center">
            <div class="flex items-center gap-3 mb-6 pl-1">
                <span class="text-xs text-white bg-[#ff8fab] px-3.5 py-1 uppercase font-round font-black rounded-full tracking-wider shadow-sm">
                    ABOUT
                </span>
                <h2 id="phil-title" class="font-round text-2xl md:text-3xl text-[#5c4d53] font-bold">

            </div>
            <div class="flex flex-col items-start gap-2.5 font-round font-bold text-sm md:text-base pl-1">

                    在忙碌的生活中，尋找一絲甜蜜的療癒...
                </span>

    <section class="px-6 max-w-3xl mx-auto w-full mb-12 relative z-10">
        <div class="bg-white/95 backdrop-blur-sm border-2 border-[#ffd1dc] p-6 md:p-8 rounded-[32px] shadow-sm flex flex-col justify-center">
            <div class="flex items-center gap-3 mb-6 pl-1">
                <span class="text-xs text-white bg-[#ff8fab] px-3.5 py-1 uppercase font-round font-black rounded-full tracking-wider shadow-sm">

            <div class="w-full aspect-video rounded-[20px] overflow-hidden border-4 border-[#fff0f3] shadow-inner bg-[#fff5f7]">
                <iframe width="100%" height="100%" src="https://www.youtube.com/embed/TZpzeNKbI3I" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>
        </div>
    </section>

    <section class="px-6 md:px-12 max-w-[90rem] mx-auto w-full mb-10 relative z-10">
        <div class="flex flex-col lg:flex-row justify-between items-center gap-6">
            <div id="filter-container" class="flex flex-wrap justify-center lg:justify-start gap-2 md:gap-3 flex-grow">
                <!-- 透過 JS 自動生成 -->
            </div>
            
            <div class="flex flex-col sm:flex-row gap-3 items-center w-full lg:w-auto shrink-0">
                <div class="relative w-full sm:w-64">
                    <input type="text" id="search-input" placeholder="搜尋標題或分類..." class="w-full px-4 py-2 pl-10 rounded-full border-2 border-[#ffd1dc] focus:border-[#ffb3c6] outline-none font-round text-sm text-[#5c4d53] transition-colors" onkeyup="renderGallery()">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-[#ffb3c6] text-sm">🔍</span>
                </div>
                
                <button onclick="shuffleGallery()" class="shrink-0 flex items-center gap-2 px-6 h-[40px] w-full sm:w-auto justify-center bg-white text-[#ff8fab] font-round text-[0.9rem] rounded-full border-2 border-[#ffd1dc] hover:border-[#ffb3c6] hover:bg-[#fff0f3] transition-all shadow-sm active:scale-95 group">
                    <span class="group-hover:rotate-180 transition-transform duration-500">✨</span>
                    <span id="shuffle-text" class="font-bold">魔法洗牌</span>
                </button>
            </div>
        </div>
    </section>

    <main class="flex-grow max-w-[90rem] mx-auto px-6 md:px-12 lg:px-24 pb-32 w-full relative z-10">
        <div id="gallery" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- 圖片透過 JS 自動渲染 -->
        </div>
    </main>

    <!-- 圖片預覽彈出視窗 (Modal) -->
    <div id="image-modal" class="fixed inset-0 z-[100] hidden flex-col items-center justify-center p-4 sm:p-8 bg-[#5c4d53]/60 backdrop-blur-sm transition-opacity duration-300 opacity-0" onclick="if(event.target === this) closeModal()">
        
        <button onclick="closeModal()" class="absolute top-6 right-6 sm:top-10 sm:right-10 text-white hover:text-[#ffb3c6] hover:scale-110 transition-all cursor-pointer z-50 bg-[#ffb3c6]/80 p-3 rounded-full border-2 border-white shadow-lg">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 sm:h-8 sm:w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>

        <div class="relative w-full max-w-6xl max-h-[75vh] flex justify-center items-center pointer-events-none">
            <img id="modal-image" src="" alt="Preview" class="outfit-transition max-w-full max-h-[70vh] object-contain border-4 border-white rounded-[24px] shadow-[0_10px_30px_rgba(0,0,0,0.2)] transform scale-95 opacity-0 pointer-events-auto">
        </div>

        <div class="mt-6 sm:mt-8 z-50 flex flex-col sm:flex-row items-center gap-4">
            <button onclick="changeOutfit()" class="px-8 py-3 rounded-full bg-white text-[#ffb3c6] border-2 border-[#ffb3c6] font-round text-sm sm:text-base hover:bg-[#fff0f3] transition-all shadow-[0_5px_15px_rgba(255,179,198,0.3)] flex items-center gap-2 hover:scale-105 active:scale-95">
                <span>🪄</span>
                <span id="modal-change-text" class="font-black">換裝</span>
            </button>

            <a id="modal-download-btn" href="#" target="_blank" class="px-8 py-3 rounded-full bg-[#ffb3c6] text-white border-2 border-white font-round text-sm sm:text-base hover:bg-[#ff8fab] transition-all shadow-[0_5px_15px_rgba(255,179,198,0.5)] flex items-center gap-2 hover:scale-105 active:scale-95">
                <span>🎀</span>
                <span id="modal-download-text" class="font-black">下載桌布</span>
            </a>
        </div>
    </div>

    <footer class="py-12 px-6 text-center border-t-2 border-[#ffd1dc] text-[#7d6b71] text-xs font-round bg-white flex flex-col gap-3 items-center relative z-10">
        <div>&copy; 2026 SWEET TREATS LABORATORY. All Sweets Reserved.</div>
        <div id="footer-copyright" class="text-[#ff8fab] bg-[#fff5f7] px-4 py-2 rounded-full border-2 border-[#ffd1dc] inline-block font-bold">
            圖片資源僅限私人非商業用途使用
        </div>
    </footer>

    <script>
        const translations = {
            zh: {
                navYt: "YouTube 頻道",
                philTitle: "頻道理念",
                philText1: "在忙碌的生活中，尋找一絲甜蜜的療癒...",
                philText2: "感受 可愛的魅力 與 溫暖",
                musicTitle: "本週推薦曲目",
                allCategory: "全部甜點 (All)",
                download: "下載",
                shuffle: "魔法洗牌",
                modalDown: "下載桌布",
                copyright: "圖片資源僅限私人非商業用途使用",
                searchPlaceholder: "搜尋標題或分類...",
                changeOutfit: "換裝"
            },
            ja: {
                navYt: "YouTube チャンネル",
                philTitle: "チャンネルの理念",
                philText1: "忙しい日常の中で、少しの甘い癒しを見つける...",
                philText2: "かわいい魅力と温もりを感じて",
                musicTitle: "おすすめの曲",
                allCategory: "すべて (All)",
                download: "ダウンロード",
                shuffle: "魔法のシャッフル",
                modalDown: "壁紙をダウンロード",
                copyright: "画像リソースは私的かつ非商業目的でのみ使用可能です",
                searchPlaceholder: "タイトルやカテゴリを検索...",
                changeOutfit: "着せ替え"
            },
            en: {
                navYt: "YouTube Channel",
                philTitle: "Philosophy",
                philText1: "Finding a touch of sweet healing in a busy life...",
                philText2: "Feel the cute charm and warmth",
                musicTitle: "Featured Music",
                allCategory: "All Sweets",
                download: "Download",
                shuffle: "Magic Shuffle",
                modalDown: "Download Wallpaper",
                copyright: "Image resources are for personal and non-commercial use only",
                searchPlaceholder: "Search titles or categories...",
                changeOutfit: "Change Outfit"
            }
        };

        // --- 根據瀏覽器自動判斷預設語言 ---
        function detectBrowserLanguage() {
            const browserLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
            if (browserLang.includes('zh')) return 'zh'; // 包含 zh-TW, zh-CN 等
            if (browserLang.includes('en')) return 'en'; // 包含 en-US, en-GB 等
            return 'ja'; // 無法判定或非中英文，一律預設為日文
        }

        let currentLang = detectBrowserLanguage(); 
        let currentCategory = 'all';
        let currentDisplayList = []; 
        let currentModalItem = null; 

        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function shuffleGallery() {
            currentDisplayList = shuffleArray([...currentDisplayList]);
            const gallery = document.getElementById('gallery');
            gallery.style.opacity = '0';
            gallery.style.transition = 'opacity 0.3s ease-in-out';
            
            setTimeout(() => {
                renderGallery();
                gallery.style.opacity = '1';
            }, 300);
        }

        function setLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            // 確保對應按鈕存在再加入 active
            const targetBtn = document.getElementById('btn-' + lang);
            if(targetBtn) targetBtn.classList.add('active');

            const t = translations[lang];
            document.getElementById('nav-yt-text').textContent = t.navYt;
            
            document.getElementById('phil-title').textContent = t.philTitle;
            document.getElementById('phil-text1').textContent = t.philText1;
            document.getElementById('phil-text2').textContent = t.philText2;
            document.getElementById('music-title').textContent = t.musicTitle;
            
            document.getElementById('shuffle-text').textContent = t.shuffle;
            document.getElementById('search-input').placeholder = t.searchPlaceholder;
            
            if(document.getElementById('modal-download-text')) document.getElementById('modal-download-text').textContent = t.modalDown;
            if(document.getElementById('modal-change-text')) document.getElementById('modal-change-text').textContent = t.changeOutfit;
            if(document.getElementById('footer-copyright')) document.getElementById('footer-copyright').textContent = t.copyright;
            
            renderFilters();
            renderGallery();
        }

        function filterCategory(category, element) {
            currentCategory = category;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if (element) {
                element.classList.add('active');
            } else {
                const target = document.getElementById('filter-' + category);
                if (target) target.classList.add('active');
            }
            renderGallery();
        }

        function renderFilters() {
            const container = document.getElementById('filter-container');
            const t = translations[currentLang];
            let html = `<button onclick="filterCategory('all', this)" id="filter-all" class="filter-btn ${currentCategory === 'all' ? 'active' : ''}">${t.allCategory}</button>`;

            if (typeof categoryDictionary !== 'undefined') {
                for (const [catKey, names] of Object.entries(categoryDictionary)) {
                    let label = names[currentLang] || names.zh;
                    html += `<button onclick="filterCategory('${catKey}', this)" id="filter-${catKey}" class="filter-btn ${currentCategory === catKey ? 'active' : ''}">${label}</button>`;
                }
            }
            container.innerHTML = html;
        }

        function renderGallery() {
            const gallery = document.getElementById('gallery');
            const t = translations[currentLang];
            const query = document.getElementById('search-input').value.toLowerCase();
            gallery.innerHTML = ''; 

            currentDisplayList.forEach(item => {
                if (currentCategory !== 'all' && item.tag.category !== currentCategory) return;

                let matchSearch = true;
                if (query) {
                    const catTextZh = categoryDictionary[item.tag.category].zh.toLowerCase();
                    const catTextJa = categoryDictionary[item.tag.category].ja.toLowerCase();
                    const catTextEn = categoryDictionary[item.tag.category].en.toLowerCase();
                    const styleTextZh = item.tag.styleDesc.zh.toLowerCase();
                    const styleTextJa = item.tag.styleDesc.ja.toLowerCase();
                    const styleTextEn = item.tag.styleDesc.en.toLowerCase();
                    
                    matchSearch = catTextZh.includes(query) || catTextJa.includes(query) || catTextEn.includes(query) ||
                                  styleTextZh.includes(query) || styleTextJa.includes(query) || styleTextEn.includes(query);
                }
                
                if (!matchSearch) return;

                let previewUrl = `https://drive.google.com/thumbnail?id=${item.fileId}&sz=w1920`;
                let downloadUrl = `https://drive.google.com/uc?export=download&id=${item.fileId}`;
                let styleDescText = item.tag.styleDesc[currentLang] || item.tag.styleDesc.zh;

                const cardHTML = `
                <div class="sweet-card flex flex-col group cursor-pointer" onclick="openModal('${item.id}')">
                    <div class="relative w-full pt-[56.25%] overflow-hidden bg-[#fff0f3]">
                        <img src="${previewUrl}" alt="Sweet Wallpaper ${item.id}" loading="lazy" 
                             class="absolute top-0 left-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" 
                             onerror="this.src='https://placehold.co/800x450/fff0f3/ffb3c6?text=Sweet+Treats'">
                        
                        <div class="absolute inset-0 bg-white opacity-0 group-hover:opacity-20 transition-opacity duration-300 pointer-events-none"></div>
                        
                        <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none">
                            <div class="bg-white/80 p-4 rounded-full text-[#ffb3c6] shadow-lg transform scale-50 group-hover:scale-100 transition-transform duration-300">
                                <span class="text-3xl">🤍</span>
                            </div>
                        </div>
                    </div>
                    <div class="p-5 flex justify-between items-center bg-white flex-grow border-t-2 border-[#ffd1dc] border-dashed">
                        <div><span class="text-sm text-[#ff8fab] font-round font-bold">${styleDescText}</span></div>
                        <a href="${downloadUrl}" target="_blank" download="Sweet_WP_${item.id}.png" 
                           class="px-4 py-1.5 rounded-full bg-[#ffb3c6] text-white text-xs font-round font-bold hover:bg-[#ff8fab] transition-all shadow-md relative z-10" onclick="event.stopPropagation();">
                            ${t.download}
                        </a>
                    </div>
                </div>`;
                gallery.innerHTML += cardHTML;
            });
        }

        function openModal(itemId) {
            currentModalItem = wallpaperDatabase.find(i => i.id === itemId);
            if(!currentModalItem) return;

            let previewUrl = `https://drive.google.com/thumbnail?id=${currentModalItem.fileId}&sz=w1920`;
            let downloadUrl = `https://drive.google.com/uc?export=download&id=${currentModalItem.fileId}`;

            const modal = document.getElementById('image-modal');
            const modalImg = document.getElementById('modal-image');
            document.getElementById('modal-download-btn').href = downloadUrl;
            modalImg.src = previewUrl;
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.classList.add('modal-open');
            
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalImg.classList.remove('opacity-0', 'scale-95');
                modalImg.classList.add('opacity-100', 'scale-100');
            }, 20);
        }

        function changeOutfit() {
            if(!currentModalItem) return;
            
            const sameCatItems = wallpaperDatabase.filter(i => 
                i.tag.category === currentModalItem.tag.category && i.id !== currentModalItem.id
            );
            
            if(sameCatItems.length === 0) return; 
            
            const nextItem = sameCatItems[Math.floor(Math.random() * sameCatItems.length)];
            currentModalItem = nextItem;
            
            const modalImg = document.getElementById('modal-image');
            
            modalImg.classList.remove('opacity-100', 'scale-100');
            modalImg.classList.add('opacity-0', 'scale-50', 'rotate-12');
            
            setTimeout(() => {
                let previewUrl = `https://drive.google.com/thumbnail?id=${nextItem.fileId}&sz=w1920`;
                let downloadUrl = `https://drive.google.com/uc?export=download&id=${nextItem.fileId}`;
                
                modalImg.src = previewUrl;
                document.getElementById('modal-download-btn').href = downloadUrl;
                
                modalImg.classList.remove('opacity-0', 'scale-50', 'rotate-12');
                modalImg.classList.add('opacity-100', 'scale-110');
                
                setTimeout(() => {
                    modalImg.classList.remove('scale-110');
                    modalImg.classList.add('scale-100');
                }, 200);
            }, 300);
        }

        function closeModal() {
            const modal = document.getElementById('image-modal');
            const modalImg = document.getElementById('modal-image');
            
            modal.classList.add('opacity-0');
            modalImg.classList.remove('opacity-100', 'scale-100', 'scale-110');
            modalImg.classList.add('opacity-0', 'scale-95');
            
            setTimeout(() => {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
                document.body.classList.remove('modal-open');
                modalImg.src = ''; 
                modalImg.classList.remove('rotate-12');
                currentModalItem = null;
            }, 300);
        }

        window.onload = function() { 
            if (typeof wallpaperDatabase !== 'undefined') {
                currentDisplayList = shuffleArray([...wallpaperDatabase]);
            }
            // 載入時依據偵測到的語言進行初始化
            setLanguage(currentLang);
        };
    </script>
</body>
</html>
