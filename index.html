<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWEET TREATS LABORATORY | 桌布分享平台</title>
    
    <!-- 字體與 Bootstrap Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Zen Maru Gothic"', 'sans-serif'],
                        mono: ['"Nunito"', 'sans-serif'],
                    },
                    colors: {
                        darkBg: '#121212',
                        darkCard: '#1a1a1a',
                        sweetAccent: '#ff8fab',
                        sweetText: '#e0e0e0',
                        darkBorder: '#333333'
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Zen Maru Gothic', sans-serif;
            /* 保留原本的網格，調整為暗色調高對比設計 */
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 143, 171, 0.1) 0%, transparent 70%),
                url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0L60 30L30 60L0 30Z' fill='%23181818' opacity='0.5'/%3E%3Cpath d='M30 0L60 30L30 60L0 30Z' stroke='%23333333' stroke-width='1' stroke-dasharray='4 2' fill='none'/%3E%3Cpath d='M0 0L60 60M60 0L0 60' stroke='%23333333' stroke-width='1' stroke-dasharray='4 2' opacity='0.3'/%3E%3C/svg%3E");
            background-attachment: fixed;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .font-round {
            font-weight: 900;
            letter-spacing: 0.02em;
        }

        /* 導覽列改為暗色毛玻璃 */
        .glass-nav {
            background: rgba(26, 26, 26, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 2px dashed #333333;
        }

        .sweet-card {
            background-color: #1a1a1a;
            border-radius: 24px;
            overflow: hidden;
            border: 2px solid #333333;
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.5);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .sweet-card:hover {
            transform: translateY(-8px) rotate(-1deg);
            box-shadow: 0 15px 30px -5px rgba(255, 143, 171, 0.15);
            border-color: #ff8fab;
        }

        .lang-btn {
            border-radius: 9999px;
            transition: all 0.2s;
            color: #9ca3af; /* Tailwind gray-400 */
            font-weight: 700;
        }
        .lang-btn.active {
            background-color: #ffb3c6;
            color: #121212;
            font-weight: 900;
        }

        .filter-btn {
            padding: 8px 20px;
            border-radius: 9999px;
            font-size: 0.9rem;
            border: 2px dashed #333333;
            background-color: #1a1a1a;
            color: #9ca3af;
            transition: all 0.2s;
            font-weight: 700;
            height: 40px;
            display: flex;
            align-items: center;
        }
        .filter-btn.active, .filter-btn:hover {
            background-color: #2a1b1f;
            color: #ffb3c6;
            border: 2px solid #ffb3c6;
            font-weight: 900;
            box-shadow: 0 5px 15px rgba(255, 143, 171, 0.1);
        }

        .cute-clock {
            color: #ffb3c6;
            text-shadow: 
                -2px -2px 0 #121212,
                 2px -2px 0 #121212,
                -2px  2px 0 #121212,
                 2px  2px 0 #121212,
                 0px  4px 0px rgba(255, 143, 171, 0.3);
        }

        body.modal-open { overflow: hidden; }
        
        .outfit-transition {
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
        /* 隱藏預設滾動條樣式，改用自定義暗黑風格 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #121212; 
        }
        ::-webkit-scrollbar-thumb {
            background: #333; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #ff8fab; 
        }
    </style>
    
    <script src="wallpapers.js"></script>
</head>
<body class="min-h-screen flex flex-col selection:bg-[#ffb3c6] selection:text-[#121212]">

                <i class="bi bi-youtube mr-1.5 text-base"></i>

    </nav>

    <!-- 頁首風格背景區塊 (暗黑主題漸層) -->

        <div class="absolute inset-0 z-0 overflow-hidden">
            <div class="absolute inset-0 bg-cover bg-center bg-no-repeat opacity-40" style="background-image: url('https://drive.google.com/thumbnail?id=1FBCo4K8lPXGpDIWTBMs1Wfz3CpKC74Yx&sz=w1920'); filter: contrast(1.1) brightness(0.8);"></div>
            <div class="absolute inset-0 bg-gradient-to-t from-[#121212] via-[#121212]/50 to-transparent"></div>

        </div>
        <header class="relative z-10 px-6 text-center max-w-4xl mx-auto w-full">
            <h1 class="font-round text-4xl md:text-5xl lg:text-6xl text-[#fff] leading-tight drop-shadow-md bg-[#1a1a1a]/80 inline-block px-8 py-3 rounded-[32px] backdrop-blur-md border-2 border-[#333] shadow-lg">

    <!-- 左右排版區塊：左側頻道理念 / 右側音樂展示 -->

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-stretch">
            
            <!-- 左側：頻道理念 (ABOUT) -->
            <div class="bg-[#1a1a1a]/95 backdrop-blur-sm border-2 border-[#333] p-8 md:p-10 rounded-[32px] shadow-lg flex flex-col justify-center h-full">
                <div class="flex items-center gap-3 mb-6 pl-1">
                    <span class="text-xs text-[#121212] bg-[#ff8fab] px-3.5 py-1 uppercase font-round font-black rounded-full tracking-wider shadow-sm flex items-center gap-1">
                        <i class="bi bi-info-circle-fill"></i> ABOUT

                    <h2 id="phil-title" class="font-round text-2xl md:text-3xl text-[#e0e0e0] font-bold">

                    <div class="flex justify-between w-full max-w-[320px] mb-1 opacity-60">

                    </div>

                <div class="flex items-center gap-3 mb-6 pl-1">

                    </span>

                <div class="w-full aspect-video rounded-[20px] overflow-hidden border-2 border-[#333] shadow-inner bg-[#121212]">

                </div>

        </div>

    <!-- 篩選與搜尋列 -->
    <section class="px-6 md:px-12 max-w-[90rem] mx-auto w-full mb-10 relative z-10">
        <div class="flex flex-col lg:flex-row justify-between items-center gap-6">
            <div id="filter-container" class="flex flex-wrap justify-center lg:justify-start gap-2 md:gap-3 flex-grow">
                <!-- 透過 JS 自動生成 -->
            </div>
            
            <div class="flex flex-col sm:flex-row gap-3 items-center w-full lg:w-auto shrink-0">
                <!-- 搜尋框 (使用 Bootstrap Icon) -->
                <div class="relative w-full sm:w-64">
                    <input type="text" id="search-input" placeholder="搜尋標題或分類..." class="w-full px-4 py-2 pl-10 rounded-full border-2 border-[#333] bg-[#1a1a1a] text-[#e0e0e0] placeholder-gray-500 focus:border-[#ffb3c6] outline-none font-round text-sm transition-colors" onkeyup="renderGallery()">
                    <i class="bi bi-search absolute left-4 top-1/2 -translate-y-1/2 text-[#ffb3c6] text-sm"></i>
                </div>
                
                <!-- 魔法洗牌 (使用 Bootstrap Icon) -->
                <button onclick="shuffleGallery()" class="shrink-0 flex items-center gap-2 px-6 h-[40px] w-full sm:w-auto justify-center bg-[#1a1a1a] text-[#ff8fab] font-round text-[0.9rem] rounded-full border-2 border-[#333] hover:border-[#ffb3c6] hover:text-[#ffb3c6] hover:bg-[#2a1b1f] transition-all shadow-sm active:scale-95 group">
                    <i class="bi bi-stars group-hover:rotate-180 transition-transform duration-500"></i>
                    <span id="shuffle-text" class="font-bold">魔法洗牌</span>
                </button>
            </div>
        </div>
    </section>

    <main class="flex-grow max-w-[90rem] mx-auto px-6 md:px-12 lg:px-24 pb-32 w-full relative z-10">
        <div id="gallery" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- 圖片透過 JS 自動渲染 -->
        </div>
    </main>

    <!-- 圖片預覽彈出視窗 (Modal 暗黑模式) -->
    <div id="image-modal" class="fixed inset-0 z-[100] hidden flex-col items-center justify-center p-4 sm:p-8 bg-black/80 backdrop-blur-md transition-opacity duration-300 opacity-0" onclick="if(event.target === this) closeModal()">
        
        <button onclick="closeModal()" class="absolute top-6 right-6 sm:top-10 sm:right-10 text-white hover:text-[#ffb3c6] hover:scale-110 transition-all cursor-pointer z-50 bg-[#1a1a1a] p-3 rounded-full border-2 border-[#333] shadow-lg flex items-center justify-center w-12 h-12">
            <i class="bi bi-x-lg text-xl"></i>
        </button>

        <div class="relative w-full max-w-6xl max-h-[75vh] flex justify-center items-center pointer-events-none">
            <img id="modal-image" src="" alt="Preview" class="outfit-transition max-w-full max-h-[70vh] object-contain border-4 border-[#333] rounded-[24px] shadow-[0_10px_40px_rgba(0,0,0,0.8)] transform scale-95 opacity-0 pointer-events-auto bg-[#121212]">
        </div>

        <div class="mt-6 sm:mt-8 z-50 flex flex-col sm:flex-row items-center gap-4">
            <!-- 換裝按鈕 (使用 Bootstrap Icon) -->
            <button onclick="changeOutfit()" class="px-8 py-3 rounded-full bg-[#1a1a1a] text-[#ffb3c6] border-2 border-[#ffb3c6] font-round text-sm sm:text-base hover:bg-[#2a1b1f] transition-all shadow-[0_5px_15px_rgba(255,143,171,0.15)] flex items-center gap-2 hover:scale-105 active:scale-95">
                <i class="bi bi-magic text-lg"></i>
                <span id="modal-change-text" class="font-black">換裝</span>
            </button>

            <!-- 下載按鈕 (使用 Bootstrap Icon) -->
            <a id="modal-download-btn" href="#" target="_blank" class="px-8 py-3 rounded-full bg-[#ffb3c6] text-[#121212] border-2 border-[#ffb3c6] font-round text-sm sm:text-base hover:bg-[#ff8fab] transition-all shadow-[0_5px_15px_rgba(255,143,171,0.3)] flex items-center gap-2 hover:scale-105 active:scale-95">
                <i class="bi bi-download text-lg"></i>
                <span id="modal-download-text" class="font-black">下載桌布</span>
            </a>
        </div>
    </div>

    <!-- 頁尾暗黑版 -->
    <footer class="py-12 px-6 text-center border-t-2 border-[#333] text-[#9ca3af] text-xs font-round bg-[#1a1a1a] flex flex-col gap-3 items-center relative z-10">
        <div>&copy; 2026 SWEET TREATS LABORATORY. All Sweets Reserved.</div>
        <div id="footer-copyright" class="text-[#ffb3c6] bg-[#2a1b1f] px-4 py-2 rounded-full border border-[#ffb3c6]/30 inline-block font-bold shadow-sm">
            圖片資源僅限私人非商業用途使用
        </div>
    </footer>

    <script>
        const translations = {
            zh: {
                navYt: "YouTube 頻道",
                philTitle: "頻道理念",
                philText1: "在忙碌的生活中，尋找一絲甜蜜的療癒...",
                philText2: "感受 可愛的魅力 與 溫暖",
                musicTitle: "本週推薦曲目",
                allCategory: "全部甜點 (All)",
                download: "下載",
                shuffle: "魔法洗牌",
                modalDown: "下載桌布",
                copyright: "圖片資源僅限私人非商業用途使用",
                searchPlaceholder: "搜尋標題或分類...",
                changeOutfit: "換裝"
            },
            ja: {
                navYt: "YouTube チャンネル",
                philTitle: "チャンネルの理念",
                philText1: "忙しい日常の中で、少しの甘い癒しを見つける...",
                philText2: "かわいい魅力と温もりを感じて",
                musicTitle: "おすすめの曲",
                allCategory: "すべて (All)",
                download: "ダウンロード",
                shuffle: "魔法のシャッフル",
                modalDown: "壁紙をダウンロード",
                copyright: "画像リソースは私的かつ非商業目的でのみ使用可能です",
                searchPlaceholder: "タイトルやカテゴリを検索...",
                changeOutfit: "着せ替え"
            },
            en: {
                navYt: "YouTube Channel",
                philTitle: "Philosophy",
                philText1: "Finding a touch of sweet healing in a busy life...",
                philText2: "Feel the cute charm and warmth",
                musicTitle: "Featured Music",
                allCategory: "All Sweets",
                download: "Download",
                shuffle: "Magic Shuffle",
                modalDown: "Download Wallpaper",
                copyright: "Image resources are for personal and non-commercial use only",
                searchPlaceholder: "Search titles or categories...",
                changeOutfit: "Change Outfit"
            }
        };

        function detectBrowserLanguage() {
            const browserLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
            if (browserLang.includes('zh')) return 'zh'; 
            if (browserLang.includes('en')) return 'en'; 
            return 'ja'; 
        }

        let currentLang = detectBrowserLanguage(); 
        let currentCategory = 'all';
        let currentDisplayList = []; 
        let currentModalItem = null; 

        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function shuffleGallery() {
            currentDisplayList = shuffleArray([...currentDisplayList]);
            const gallery = document.getElementById('gallery');
            gallery.style.opacity = '0';
            gallery.style.transition = 'opacity 0.3s ease-in-out';
            
            setTimeout(() => {
                renderGallery();
                gallery.style.opacity = '1';
            }, 300);
        }

        function setLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            const targetBtn = document.getElementById('btn-' + lang);
            if(targetBtn) targetBtn.classList.add('active');

            const t = translations[lang];
            document.getElementById('nav-yt-text').textContent = t.navYt;
            
            document.getElementById('phil-title').textContent = t.philTitle;
            document.getElementById('phil-text1').textContent = t.philText1;
            document.getElementById('phil-text2').textContent = t.philText2;
            document.getElementById('music-title').textContent = t.musicTitle;
            
            document.getElementById('shuffle-text').textContent = t.shuffle;
            document.getElementById('search-input').placeholder = t.searchPlaceholder;
            
            if(document.getElementById('modal-download-text')) document.getElementById('modal-download-text').textContent = t.modalDown;
            if(document.getElementById('modal-change-text')) document.getElementById('modal-change-text').textContent = t.changeOutfit;
            if(document.getElementById('footer-copyright')) document.getElementById('footer-copyright').textContent = t.copyright;
            
            renderFilters();
            renderGallery();
        }

        function filterCategory(category, element) {
            currentCategory = category;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if (element) {
                element.classList.add('active');
            } else {
                const target = document.getElementById('filter-' + category);
                if (target) target.classList.add('active');
            }
            renderGallery();
        }

        function renderFilters() {
            const container = document.getElementById('filter-container');
            const t = translations[currentLang];
            let html = `<button onclick="filterCategory('all', this)" id="filter-all" class="filter-btn ${currentCategory === 'all' ? 'active' : ''}">${t.allCategory}</button>`;

            if (typeof categoryDictionary !== 'undefined') {
                for (const [catKey, names] of Object.entries(categoryDictionary)) {
                    let label = names[currentLang] || names.zh;
                    html += `<button onclick="filterCategory('${catKey}', this)" id="filter-${catKey}" class="filter-btn ${currentCategory === catKey ? 'active' : ''}">${label}</button>`;
                }
            }
            container.innerHTML = html;
        }

        function renderGallery() {
            const gallery = document.getElementById('gallery');
            const t = translations[currentLang];
            const query = document.getElementById('search-input').value.toLowerCase();
            gallery.innerHTML = ''; 

            currentDisplayList.forEach(item => {
                if (currentCategory !== 'all' && item.tag.category !== currentCategory) return;

                let matchSearch = true;
                if (query) {
                    const catTextZh = categoryDictionary[item.tag.category].zh.toLowerCase();
                    const catTextJa = categoryDictionary[item.tag.category].ja.toLowerCase();
                    const catTextEn = categoryDictionary[item.tag.category].en.toLowerCase();
                    const styleTextZh = item.tag.styleDesc.zh.toLowerCase();
                    const styleTextJa = item.tag.styleDesc.ja.toLowerCase();
                    const styleTextEn = item.tag.styleDesc.en.toLowerCase();
                    
                    matchSearch = catTextZh.includes(query) || catTextJa.includes(query) || catTextEn.includes(query) ||
                                  styleTextZh.includes(query) || styleTextJa.includes(query) || styleTextEn.includes(query);
                }
                
                if (!matchSearch) return;

                let previewUrl = `https://drive.google.com/thumbnail?id=${item.fileId}&sz=w1920`;
                let downloadUrl = `https://drive.google.com/uc?export=download&id=${item.fileId}`;
                let styleDescText = item.tag.styleDesc[currentLang] || item.tag.styleDesc.zh;

                const cardHTML = `
                <div class="sweet-card flex flex-col group cursor-pointer" onclick="openModal('${item.id}')">
                    <div class="relative w-full pt-[56.25%] overflow-hidden bg-[#121212]">
                        <img src="${previewUrl}" alt="Sweet Wallpaper ${item.id}" loading="lazy" 
                             class="absolute top-0 left-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" 
                             onerror="this.src='https://placehold.co/800x450/1a1a1a/ffb3c6?text=Sweet+Treats'">
                        
                        <div class="absolute inset-0 bg-black opacity-0 group-hover:opacity-40 transition-opacity duration-300 pointer-events-none"></div>
                        
                        <!-- Hover 出現愛心圖示 -->
                        <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none">
                            <div class="bg-[#1a1a1a]/80 p-4 rounded-full text-[#ffb3c6] shadow-lg transform scale-50 group-hover:scale-100 transition-transform duration-300 flex items-center justify-center w-14 h-14">
                                <i class="bi bi-heart-fill text-2xl mt-1"></i>
                            </div>
                        </div>
                    </div>
                    <div class="p-5 flex justify-between items-center bg-[#1a1a1a] flex-grow border-t-2 border-[#333] border-dashed">
                        <div><span class="text-xs md:text-sm text-[#ffb3c6] font-round font-bold">${styleDescText}</span></div>
                        <a href="${downloadUrl}" target="_blank" download="Sweet_WP_${item.id}.png" 
                           class="px-4 py-1.5 rounded-full bg-[#ffb3c6] text-[#121212] text-xs font-round font-bold hover:bg-[#ff8fab] transition-all shadow-md relative z-10 shrink-0 ml-2 flex items-center gap-1.5" onclick="event.stopPropagation();">
                            <i class="bi bi-download"></i> ${t.download}
                        </a>
                    </div>
                </div>`;
                gallery.innerHTML += cardHTML;
            });
        }

        function openModal(itemId) {
            currentModalItem = wallpaperDatabase.find(i => i.id === itemId);
            if(!currentModalItem) return;

            let previewUrl = `https://drive.google.com/thumbnail?id=${currentModalItem.fileId}&sz=w1920`;
            let downloadUrl = `https://drive.google.com/uc?export=download&id=${currentModalItem.fileId}`;

            const modal = document.getElementById('image-modal');
            const modalImg = document.getElementById('modal-image');
            document.getElementById('modal-download-btn').href = downloadUrl;
            modalImg.src = previewUrl;
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.classList.add('modal-open');
            
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalImg.classList.remove('opacity-0', 'scale-95');
                modalImg.classList.add('opacity-100', 'scale-100');
            }, 20);
        }

        function changeOutfit() {
            if(!currentModalItem) return;
            
            const sameCatItems = wallpaperDatabase.filter(i => 
                i.tag.category === currentModalItem.tag.category && i.id !== currentModalItem.id
            );
            
            if(sameCatItems.length === 0) return; 
            
            const nextItem = sameCatItems[Math.floor(Math.random() * sameCatItems.length)];
            currentModalItem = nextItem;
            
            const modalImg = document.getElementById('modal-image');
            
            modalImg.classList.remove('opacity-100', 'scale-100');
            modalImg.classList.add('opacity-0', 'scale-50', 'rotate-12');
            
            setTimeout(() => {
                let previewUrl = `https://drive.google.com/thumbnail?id=${nextItem.fileId}&sz=w1920`;
                let downloadUrl = `https://drive.google.com/uc?export=download&id=${nextItem.fileId}`;
                
                modalImg.src = previewUrl;
                document.getElementById('modal-download-btn').href = downloadUrl;
                
                modalImg.classList.remove('opacity-0', 'scale-50', 'rotate-12');
                modalImg.classList.add('opacity-100', 'scale-110');
                
                setTimeout(() => {
                    modalImg.classList.remove('scale-110');
                    modalImg.classList.add('scale-100');
                }, 200);
            }, 300);
        }

        function closeModal() {
            const modal = document.getElementById('image-modal');
            const modalImg = document.getElementById('modal-image');
            
            modal.classList.add('opacity-0');
            modalImg.classList.remove('opacity-100', 'scale-100', 'scale-110');
            modalImg.classList.add('opacity-0', 'scale-95');
            
            setTimeout(() => {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
                document.body.classList.remove('modal-open');
                modalImg.src = ''; 
                modalImg.classList.remove('rotate-12');
                currentModalItem = null;
            }, 300);
        }

        function initCuteClock() {
            const clockEl = document.getElementById('cute-clock');
            const dateEl = document.getElementById('cute-date');
            if(!clockEl || !dateEl) return;
            
            function updateClock() {
                const now = new Date();
                const h = String(now.getHours()).padStart(2, '0');
                const m = String(now.getMinutes()).padStart(2, '0');
                const s = String(now.getSeconds()).padStart(2, '0');
                
                clockEl.textContent = `${h}:${m}:${s}`;
                
                const y = now.getFullYear();
                const mo = String(now.getMonth() + 1).padStart(2, '0');
                const d = String(now.getDate()).padStart(2, '0');
                dateEl.textContent = `${y}.${mo}.${d}`;
            }
            setInterval(updateClock, 1000);
            updateClock(); 
        }

        window.onload = function() { 
            if (typeof wallpaperDatabase !== 'undefined') {
                currentDisplayList = shuffleArray([...wallpaperDatabase]);
            }
            setLanguage(currentLang);
            initCuteClock(); 
        };
    </script>
</body>
</html>
